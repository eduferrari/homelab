# MesaFácil atrás do proxy do Coolify (Traefik) — etapa 1 da migração.
# Instalar em: /data/coolify/proxy/dynamic/mesafacil.yaml  (o Traefik recarrega sozinho)
#
# Pré-requisitos:
#   - certificado da LAN e middlewares do homelab: sudo /opt/homelab/scripts/homelab-ca.sh issue
#   - entrypoints p8081, p8082 e p8083 no proxy do Coolify (README → "Portas extras no proxy")
#   - containers do MesaFácil na rede "coolify" (o Traefik os alcança pelo nome)
# Somente LAN (issue #118). Ajuste o IP se mudar (HOMELAB_IP no .env).
http:
  routers:
    # Porta 80 → https://<host>/  (site)
    mesafacil-http:
      entryPoints: [http]
      rule: "Host(`homelab-eduardo.local`) || Host(`192.168.101.28`)"
      middlewares: [homelab-lan-only@file, homelab-redirect-https@file]
      service: mesafacil-site

    # Site institucional (443)
    mesafacil-site:
      entryPoints: [https]
      rule: "Host(`homelab-eduardo.local`) || Host(`192.168.101.28`)"
      middlewares: [homelab-lan-only@file, mesafacil-headers, mesafacil-compress]
      service: mesafacil-site
      tls: {}

    # PDV (8081)
    mesafacil-pdv:
      entryPoints: [p8081]
      rule: "PathPrefix(`/`)"
      middlewares: [homelab-lan-only@file, mesafacil-headers, mesafacil-compress]
      service: mesafacil-pdv
      tls: {}

    # CRM (8082)
    mesafacil-crm:
      entryPoints: [p8082]
      rule: "PathPrefix(`/`)"
      middlewares: [homelab-lan-only@file, mesafacil-headers, mesafacil-compress]
      service: mesafacil-crm
      tls: {}

    # API (8083) — sem compressão: GET /mesas/{id}/eventos é SSE e precisa chegar sem buffer
    mesafacil-api:
      entryPoints: [p8083]
      rule: "PathPrefix(`/`)"
      middlewares: [homelab-lan-only@file, mesafacil-headers]
      service: mesafacil-api
      tls: {}

  middlewares:
    mesafacil-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Server: ""
    mesafacil-compress:
      compress: {}

  services:
    mesafacil-site:
      loadBalancer:
        servers: [{ url: "http://mesafacil-site:80" }]
    mesafacil-pdv:
      loadBalancer:
        servers: [{ url: "http://mesafacil-pdv:80" }]
    mesafacil-crm:
      loadBalancer:
        servers: [{ url: "http://mesafacil-crm:8080" }]
    mesafacil-api:
      loadBalancer:
        servers: [{ url: "http://mesafacil-api:8080" }]
